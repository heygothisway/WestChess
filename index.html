<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2b2b">
<link rel="manifest" href="manifest.json">
<title>西洋棋</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#2b2b2b;color:#eee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px}
#status{font-size:18px;margin:8px 0;min-height:26px;text-align:center}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:min(96vw,70vh);aspect-ratio:1;border:3px solid #555;user-select:none}
.sq{display:flex;align-items:center;justify-content:center;font-size:min(10.5vw,8.5vh);line-height:1;position:relative}
.l{background:#f0d9b5;color:#000}.d{background:#b58863;color:#000}
.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000}.b{color:#111}
.sel{background:#f6f669!important}.last{box-shadow:inset 0 0 0 100px rgba(255,255,0,.35)}
.chk{background:#e55!important}
.hint::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(0,120,0,.5);position:absolute}
.hint.cap::after{width:90%;height:90%;background:none;border:4px solid rgba(0,120,0,.6)}
#ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
select,button{font-size:16px;padding:10px 14px;border-radius:8px;border:0;background:#444;color:#eee}
button{background:#3a7d44}
#promo{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;gap:10px}
#promo button{font-size:48px;background:#eee;padding:8px 14px}
</style>
</head>
<body>
<div id="status"></div>
<div id="board"></div>
<div id="ctl">
 <select id="mode">
  <option value="cpu">對電腦</option>
  <option value="two">雙人（同一支手機）</option>
 </select>
 <select id="level">
  <option value="1">電腦：入門</option>
  <option value="2" selected>電腦：普通</option>
  <option value="3">電腦：困難</option>
 </select>
 <select id="side">
  <option value="w">我執白</option>
  <option value="b">我執黑</option>
 </select>
 <button id="new">新遊戲</button>
 <button id="undo">悔棋</button>
</div>
<div id="promo"></div>
<script type="module" src="app.js"></script>
</body>
</html>
